<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <title>States — 更新</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <script src="components.js" defer></script>
</head>
<body>
<!-- Rules: ../spec/updates.md. Settings' 通用 tab is on settings-states.html. -->
<main class="board" data-board="updates">
  <div class="board-title">States — 更新</div>
  <p class="caption">规则见 spec/updates.md。菜单栏菜单在「设置…」之后多一项「检查更新…」;后台检查发现新版本时,这一项变为「安装新版本 1.1.0…」,不弹窗、不抢焦点(设置「通用」页的「自动检查更新」一行同时变为「新版本 1.1.0 可以安装」)。点击后出现 Sparkle 自带的更新窗口(系统语言为简体中文时为中文),显示更新说明,由用户选择安装、跳过或稍后提醒。</p>
  <div class="brand-menubars">
    <figure><div class="state-label">平时(status-menu)</div>
      <cida-status-menu state="status-menu"></cida-status-menu></figure>
    <figure><div class="state-label">发现新版本(status-menu-update-available)</div>
      <cida-status-menu state="status-menu-update-available" update="available"></cida-status-menu></figure>
  </div>
</main>
</body>
</html>
