<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <title>States — 设置</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <script src="components.js" defer></script>
</head>
<body>
<!-- Rules: ../spec/settings.md. The state names are the app's
     --design-state values where one exists. -->
<main class="board" data-board="settings-states">
  <div class="board-title">States — 设置</div>
  <p class="caption">规则见 spec/settings.md。四个标签:模型 · 翻译 · 快捷键 · 通用;标题跟着标签,窗口 560 宽,高度随当前标签的内容,切换时顶边不动。「模型」页的各个状态在 configuration.html;这里的状态都是模型已就绪。除 settings-shortcuts-custom 外,两项权限都是未授权的「去授权」。实现侧 --design-state 与状态名相同。</p>
  <div class="states-grid">
    <figure><div class="state-label">模型 · 打开设置的默认页(settings)</div>
      <cida-settings state="settings"></cida-settings></figure>
    <figure><div class="state-label">动作(settings-translation)</div>
      <cida-settings state="settings-translation" tab="translation"></cida-settings></figure>
    <figure><div class="state-label">动作 · 分段焦点(settings-action-keyboard-focus)</div>
      <cida-settings state="settings-action-keyboard-focus" tab="translation" focused-control="action-improve"></cida-settings></figure>
    <figure><div class="state-label">动作试运行 · running</div><cida-settings state="settings-action-running" tab="translation" trial="running"></cida-settings></figure>
    <figure><div class="state-label">动作试运行 · stopped</div><cida-settings state="settings-action-stopped" tab="translation" trial="stopped"></cida-settings></figure>
    <figure><div class="state-label">动作试运行 · result</div><cida-settings state="settings-action-result" tab="translation" trial="result"></cida-settings></figure>
    <figure><div class="state-label">动作试运行 · editing</div><cida-settings state="settings-action-editing" tab="translation" trial="editing"></cida-settings></figure>
    <figure><div class="state-label">动作试运行 · saved-failed</div><cida-settings state="settings-action-saved-failed" tab="translation" trial="saved-failed"></cida-settings></figure>
    <figure><div class="state-label">动作试运行 · failed</div><cida-settings state="settings-action-failed" tab="translation" trial="failed"></cida-settings></figure>
    <figure><div class="state-label">动作试运行 · configuration</div><cida-settings state="settings-action-configuration" tab="translation" trial="configuration"></cida-settings></figure>
    <figure><div class="state-label">动作 · 编辑按钮焦点(settings-action-edit-focus)</div>
      <cida-settings state="settings-action-edit-focus" tab="translation" focused-control="action-edit"></cida-settings></figure>
    <figure><div class="state-label">翻译 · 我的语言输入中(settings-language-editing)</div>
      <cida-settings state="settings-language-editing" tab="translation" language="editing"></cida-settings></figure>
    <figure><div class="state-label">动作 · 编辑改进提示词(settings-prompt-editing)</div>
      <cida-settings state="settings-prompt-editing" tab="translation" editing="improve"></cida-settings></figure>
    <figure><div class="state-label">快捷键 · 未授权(settings-shortcuts)</div>
      <cida-settings state="settings-shortcuts" tab="shortcuts"></cida-settings></figure>
    <figure><div class="state-label">快捷键 · 自定义快捷键 · 两项权限已开启(settings-shortcuts-custom)</div>
      <cida-settings state="settings-shortcuts-custom" tab="shortcuts" shortcut="custom" grants="all"></cida-settings></figure>
    <figure><div class="state-label">快捷键 · 只用截图翻译:显示辞达与原处翻译未设置(settings-shortcuts-unset)</div>
      <cida-settings state="settings-shortcuts-unset" tab="shortcuts" shortcut="unset"></cida-settings></figure>
    <figure><div class="state-label">快捷键 · 录制中,⌫ 不设置(settings-recording)</div>
      <cida-settings state="settings-recording" tab="shortcuts" shortcut="recording"></cida-settings></figure>
    <figure><div class="state-label">通用(settings-general)</div>
      <cida-settings state="settings-general" tab="general"></cida-settings></figure>
    <figure><div class="state-label">通用 · 键盘焦点在模型(settings-general-keyboard-focus)</div>
      <cida-settings state="settings-general-keyboard-focus" tab="general" focused-tab="model"></cida-settings></figure>
    <figure><div class="state-label">通用 · 当前标签获得键盘焦点(settings-general-selected-focus)</div>
      <cida-settings state="settings-general-selected-focus" tab="general" focused-tab="general"></cida-settings></figure>
    <figure><div class="state-label">通用 · 开关焦点(settings-general-toggle-focus)</div>
      <cida-settings state="settings-general-toggle-focus" tab="general" focused-control="launch"></cida-settings></figure>
    <figure><div class="state-label">通用 · 开启的开关焦点(settings-general-toggle-on-focus)</div>
      <cida-settings state="settings-general-toggle-on-focus" tab="general" launch="on" focused-control="launch"></cida-settings></figure>
    <figure><div class="state-label">通用 · 按钮焦点(settings-general-button-focus)</div>
      <cida-settings state="settings-general-button-focus" tab="general" focused-control="updates"></cida-settings></figure>
    <figure><div class="state-label">快捷键 · 按钮焦点(settings-shortcuts-keyboard-focus)</div>
      <cida-settings state="settings-shortcuts-keyboard-focus" tab="shortcuts" focused-control="shortcut"></cida-settings></figure>
    <figure><div class="state-label">通用 · 有新版本可以安装(settings-update-available)</div>
      <cida-settings state="settings-update-available" tab="general" update="available"></cida-settings></figure>
  </div>
</main>
</body>
</html>
