<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <title>States — 官网</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <style>
    .site-frame { display: block; border: 0; border-radius: 10px; background: var(--bg); box-shadow: 0 0 0 1px var(--border); }
    .site-frames { display: flex; gap: 40px; align-items: flex-start; }
  </style>
</head>
<body>
<!-- Rules: ../spec/website.md. The page itself is website/index.html, rendered here from its
     source at a desktop and a phone width. -->
<main class="board" data-board="website">
  <div class="board-title">States — 官网 cida.xuanwo.io</div>
  <p class="caption">规则见 spec/website.md。一页讲完三件事:辞达做什么(首屏的面板和五个按键)、怎么装(三步与两个可选权限)、文字去哪里(隐私)。颜色、字体和面板都取自应用的 tokens.css 与 components.css;首屏的面板就是应用的面板,上线后译文在里面逐字流出。</p>
  <div class="site-frames">
    <figure style="margin:0">
      <div class="state-label">桌面 · 1280 宽</div>
      <iframe class="site-frame" data-state="website-desktop" src="../../website/index.html?still" width="1280" height="900"></iframe>
    </figure>
    <figure style="margin:0">
      <div class="state-label">手机 · 390 宽</div>
      <iframe class="site-frame" data-state="website-mobile" src="../../website/index.html?still" width="390" height="900"></iframe>
    </figure>
    <figure style="margin:0">
      <div class="state-label">更新记录 · 1280 宽</div>
      <iframe class="site-frame" data-state="website-releases" src="../../website/releases/index.html" width="1280" height="900"></iframe>
    </figure>
  </div>
</main>
<script>
  // Each frame grows to its page's full height so the render shows the whole page;
  // scripts/render-design.swift waits for boardReady before measuring.
  const loaded = frame => new Promise(resolve => {
    const page = frame.contentDocument;
    if (page?.URL.endsWith(frame.getAttribute("src").replace(/^(\.\.\/)+/, "")) && page.readyState === "complete") resolve();
    else frame.addEventListener("load", resolve, { once: true });
  });
  window.boardReady = Promise.all([...document.querySelectorAll(".site-frame")].map(async frame => {
    await loaded(frame);
    await Promise.race([frame.contentDocument.fonts.ready, new Promise(r => setTimeout(r, 3000))]);
    frame.height = frame.contentDocument.documentElement.scrollHeight;
  }));
</script>
</body>
</html>
