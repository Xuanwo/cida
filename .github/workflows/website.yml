# Deploys cida.xuanwo.io from main after a push that changes it; the CI workflow builds it on
# every pull request. A release does not redeploy it by itself: run this workflow by hand after
# tagging, so the page shows the new version (docs/development.md).
name: Website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - scripts/build-website.py
      - scripts/ci/release-notes.py
      - docs/releases/**
      - Design/boards/tokens.css
      - Design/boards/components.css
      - Design/boards/components.js
      - Design/rendered/states/brand-icon.png
      - Resources/AppIcon.icon/Assets/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The page shows the newest release tag and its notes.
          fetch-depth: 0

      - name: Build
        run: python3 scripts/build-website.py

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config website/wrangler.jsonc
