# Builds with warnings as errors and runs the Swift tests on every pull request and push to
# main. The Tart journeys and gates run locally; see AGENTS.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test
